<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>バリュー決済のご利用方法</title>
<style>
html,body{margin:0;padding:0;background:#fff;min-height:100%}body{display:flex;justify-content:center;align-items:flex-start}img{display:block;width:min(100%,600px);height:auto;margin:0 auto}
</style>
</head>
<body>
<img id="flyer" alt="バリュー決済のご利用方法">
<script>
(async()=>{
 const files=['small00.txt','small01.txt','small02.txt','small03.txt','small04.txt'];
 const parts=await Promise.all(files.map(async f=>{const r=await fetch(f);if(!r.ok)throw new Error(f);return r.text();}));
 document.getElementById('flyer').src='data:image/webp;base64,'+parts.join('');
})().catch(()=>{document.body.textContent='画像の読み込みに失敗しました。';});
</script>
</body>
</html>
